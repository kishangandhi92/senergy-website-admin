<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
    <div
        class="relative flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center sm:justify-between md:px-8">
        <div class="text-4xl font-extrabold tracking-tight">{{ pageTitle }}</div>

        <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="downloadExcel()">
                <mat-icon [svgIcon]="'mat_outline:file_download'"></mat-icon>
                <span class="ml-2 mr-1">Download Excel</span>
            </button>
        </div>
    </div>

    <div class="flex flex-auto overflow-hidden">
        <div class="flex flex-auto flex-col overflow-hidden sm:overflow-y-auto">
            @if (displayedColumns.length > 0) {
            <div class="overflow-x-auto">
                <table
                    mat-table
                    [dataSource]="dataSource"
                    matSort
                    matSortDisableClear
                    class="enquiries-table w-full"
                    [style.--enquiry-column-count]="displayedColumns.length">
                    @for (column of columns; track column.key) {
                    <ng-container [matColumnDef]="column.key">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>
                            {{ column.label }}
                        </th>
                        <td mat-cell *matCellDef="let enquiry">
                            <span class="block truncate" [title]="enquiry[column.key] ?? ''">
                                {{ enquiry[column.key] ?? '-' }}
                            </span>
                        </td>
                    </ng-container>
                    }

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns.length">
                            There are no enquiries yet!
                        </td>
                    </tr>
                </table>
            </div>
            }
            @else {
            <div class="border-t p-8 text-center text-4xl tracking-tight sm:p-16">
                There are no enquiries yet!
            </div>
            }
        </div>
    </div>
</div>
