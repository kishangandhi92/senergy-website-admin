<div class="flex min-w-0 flex-auto flex-col items-center sm:justify-center login-bg">
    <div class="w-full px-4 py-8 sm:bg-card sm:w-auto sm:rounded-2xl sm:p-12 sm:shadow">
        <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">
            <!-- Logo -->
            <!-- <div class="w-12">
                <img src="images/logo/logo.png" alt="Teledocs AI" />
            </div> -->

            <!-- Title -->
            <div class="mt-8 text-4xl font-extrabold leading-tight tracking-tight">
                Forgot password?
            </div>
            <div class="mt-0.5 font-medium">
                Fill the below form to reset your password
            </div>

            <!-- Alert -->
            @if (showAlert) {
            <fuse-alert class="mt-8" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
                [@shake]="alert.type === 'error'">
                {{ alert.message }}
            </fuse-alert>
            }

            <!-- Forgot password form -->
            <form class="mt-8" [formGroup]="forgotPasswordForm" #forgotPasswordNgForm="ngForm">
                <!-- Email field -->
                <mat-form-field class="w-full">
                    <mat-label>Email ID</mat-label>
                    <input id="emailId" type="email" matInput [formControlName]="'emailId'" email />
                    @if (forgotPasswordForm.get('emailId').hasError('required')) {
                    <mat-error> Email ID is required </mat-error>
                    }
                    @if (forgotPasswordForm.get('emailId').hasError('email')) {
                    <mat-error> Email ID is not valid </mat-error>
                    }
                </mat-form-field>

                <!-- Submit button -->
                <button class="fuse-mat-button-large mt-3 w-full" mat-flat-button [color]="'primary'"
                    [disabled]="forgotPasswordForm.disabled || forgotPasswordForm.invalid" (click)="sendResetLink()">
                    @if (!forgotPasswordForm.disabled) {
                    <span> Request Password Reset </span>
                    }
                    @if (forgotPasswordForm.disabled) {
                    <mat-progress-spinner [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
                    }
                </button>

                <!-- Form footer -->
                <div class="text-secondary mt-8 text-md font-medium">
                    <span>Return to</span>
                    <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-in']">sign in
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
